# XcodeGen 설정. WhisperNotes.xcodeproj는 여기서 만들고 저장소에 넣지 않는다 (scripts/build.sh가 xcodegen generate를 부른다).
name: WhisperNotes
options:
  bundleIdPrefix: io.github.videin
  deploymentTarget:
    # PLAN.md §1. CI 러너(macos-26)의 Xcode 26으로 빌드할 수 있는 버전으로 둔다
    iOS: "26.4"
  developmentLanguage: ko
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    # CI가 실행 번호로 덮어쓴다 (scripts/build.sh): 버전 0.1.<번호>
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "0"
    # 빌드 정보 (Info.plist의 WhisperNotesBuild → BuildInfo.swift). 로컬 빌드는 이 값 그대로
    WHISPERNOTES_BUILD_RUN: "0"
    WHISPERNOTES_BUILD_BRANCH: ""
    WHISPERNOTES_BUILD_COMMIT: ""

targets:
  WhisperNotes:
    type: application
    platform: iOS
    sources:
      - WhisperNotes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.videin.whispernotes
        INFOPLIST_FILE: WhisperNotes/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # 아이패드 전용
        TARGETED_DEVICE_FAMILY: "2"
        # WhisperNotes/Assets.xcassets (임시 아이콘은 scripts/make-app-icon.py로 만든다). TestFlight에 올리려면 있어야 한다
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
    scheme: {}
